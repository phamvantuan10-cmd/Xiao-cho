name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Giai nen project
        run: unzip -o XiaoTroAssistant.zip -d .

      - name: Cai dat JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai dat Android SDK
        uses: android-actions/setup-android@v3

      - name: Cai dat Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug
        working-directory: XiaoTroAssistant

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XiaoTroAssistant-debug-apk
          path: XiaoTroAssistant/app/build/outputs/apk/debug/app-debug.apk
          
