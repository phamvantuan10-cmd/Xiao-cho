name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Giai nen project
        run: unzip -o XiaoTroAssistant.zip -d .

      - name: Tai model nhan dien khuon mat (mobilefacenet.tflite)
        run: |
          mkdir -p XiaoTroAssistant/app/src/main/assets
          curl -L -f -o XiaoTroAssistant/app/src/main/assets/mobilefacenet.tflite \
            https://github.com/MCarlomagno/FaceRecognitionAuth/raw/master/assets/mobilefacenet.tflite
          ls -la XiaoTroAssistant/app/src/main/assets/

      - name: Cai dat JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai dat Android SDK
        uses: android-actions/setup-android@v3

      - name: Cai dat Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK (ban debug, cai thu duoc ngay)
        run: gradle assembleDebug
        working-directory: XiaoTroAssistant

      - name: Dua file APK len de tai ve
        uses: actions/upload-artifact@v4
        with:
          name: XiaoTroAssistant-debug-apk
          path: XiaoTroAssistant/app/build/outputs/apk/debug/app-debug.apk
